const HC=['#ffffff','#fff3e0','#ffc0cb','#ff4f9a','#c0496b','#e8483a','#ff9a3c','#ffd84a','#5ac86a','#2a7a4a','#4ac8d8','#6aa8ff','#2a4ac0','#18254a','#b79cff','#6a3ac0','#3a3a48','#111111'],HR=['#2a1a3a','#111111','#5a3a24','#c8a050','#e8e0d0','#c0496b','#6a5aff','#3ac8b0'];
function wardP(){openP('👚 Wardrobe','<b class="mut">Hoodie</b><div class="row">'+HC.map(c=>'<button class="sw '+(c===S.hoodie?'a':'')+'" style="background:'+c+'" onclick="sh(\''+c+'\')" aria-label="Hoodie '+c+'"></button>').join('')+'</div><b class="mut">Hair colour</b><div class="row">'+HR.map(c=>'<button class="sw '+(c===S.hair?'a':'')+'" style="background:'+c+'" onclick="sc2(\''+c+'\')" aria-label="Hair '+c+'"></button>').join('')+'</div><b class="mut">Hairstyle</b><div class="row">'+['Bob','Messy','Ponytail'].map((n,i)=>'<button '+(S.style===i?'class="go"':'')+' onclick="ss('+i+')">'+n+'</button>').join('')+'</div><p class="mut">Changes apply to the 3D character instantly and are saved.</p>')}
window.sh=c=>{S.hoodie=c;ch.userData.recolor();save();wardP()};window.sc2=c=>{S.hair=c;ch.userData.recolor();save();wardP()};window.ss=i=>{S.style=i;ch.userData.recolor();save();wardP()};
/* ---------- INTERACTION ---------- */
Object.assign(AP,{shelf:{x:-3,z:-3.4,rot:Math.PI,fn:shelfP,name:'bookshelf'},ward:{x:.3,z:-3.4,rot:Math.PI,fn:wardP,name:'wardrobe'},desk:{x:-3.95,z:0,rot:-Math.PI/2,fn:()=>{P.sit=true;deskP()},name:'desk'}});
let mark=null,hl=null,cheer=0;
function setHL(g){if(hl){hl.traverse(o=>{if(o.material&&o.material.emissive&&o._e!==undefined)o.material.emissive.setHex(o._e)});hl=null}if(g){hl=g;g.traverse(o=>{if(o.material&&o.material.emissive){o._e=o.material.emissive.getHex();o.material.emissive.setHex(0x3a2a6a)}})}}
function goTo(x,z,act){const p=path(P.x,P.z,x,z);if(!p){toast('Can’t reach that spot');return false}P.path=p;P.act=act||null;if(P.sit){P.sit=false}closeP();return true}
const ray=new THREE.Raycaster(),mv=new THREE.Vector2(),pl=new THREE.Plane(new THREE.Vector3(0,1,0),0);let dn=null;
R.domElement.addEventListener('pointerdown',e=>dn=[e.clientX,e.clientY]);
R.domElement.addEventListener('pointerup',e=>{if(!dn||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>6)return;mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);
const hit=ray.intersectObjects([...IA,cat],true)[0];if(hit){let o=hit.object;while(o&&!o.userData.id)o=o.parent;if(o){setHL(o);setTimeout(()=>setHL(null),500);
if(o.userData.id==='cat'){const d=Math.hypot(P.x-C.x,P.z-C.z);if(d>2.2)goTo(C.x-1,C.z,{rot:Math.atan2(C.x-P.x,C.z-P.z),fn:petCat});else petCat();return}
const a=AP[o.userData.id];if(a)goTo(a.x,a.z,a);return}}
const pt=new THREE.Vector3();if(ray.ray.intersectPlane(pl,pt)){if(pt.x<-5.9||pt.x>5.9||pt.z<-4.9||pt.z>4.9)return;if(goTo(pt.x,pt.z)){if(!mark){mark=new THREE.Mesh(new THREE.RingGeometry(.2,.3,24),new THREE.MeshBasicMaterial({color:0xffc857}));mark.rotation.x=-Math.PI/2;sc.add(mark)}mark.position.set(pt.x,.06,pt.z);mark.visible=true}}});
function petCat(){S.bond++;save();say(['Purr… 💕','Mrrp!','More pets please!'][S.bond%3]);cheer=1.2;P.busy=.8;P.anim='pet'}
const keys={};addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'){return}if(e.key==='Escape')closeP();keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
/* ---------- LOOP ---------- */
const ad=(a,b)=>{let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d};
function stepTo(o,tx,tz,sp_,dt){const dx=tx-o.x,dz=tz-o.z,d=Math.hypot(dx,dz);if(d<.02)return d;const st=Math.min(sp_*dt,d),nx=o.x+dx/d*st,nz=o.z+dz/d*st;o.rot+=ad(o.rot,Math.atan2(dx,dz))*Math.min(1,dt*12);if(free(nx,nz,.28)||o!==P){o.x=nx;o.z=nz}else if(free(nx,o.z,.28))o.x=nx;else if(free(o.x,nz,.28))o.z=nz;return d}
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
let kx=0,kz=0;if(keys.w||keys.arrowup){kx--;kz--}if(keys.s||keys.arrowdown){kx++;kz++}if(keys.a||keys.arrowleft){kx--;kz++}if(keys.d||keys.arrowright){kx++;kz--}
let moving=false;const run=keys.shift?4.2:2.8;
if(kx||kz){if(P.sit){P.sit=false;closeP()}P.path=[];P.act=null;P.busy=0;const l=Math.hypot(kx,kz),vx=kx/l*run*dt,vz=kz/l*run*dt;if(free(P.x+vx,P.z+vz))P.x+=vx,P.z+=vz;else if(free(P.x+vx,P.z))P.x+=vx;else if(free(P.x,P.z+vz))P.z+=vz;P.rot+=ad(P.rot,Math.atan2(kx,kz))*Math.min(1,dt*12);moving=true;if(mark)mark.visible=false}
else if(P.busy>0){P.busy-=dt;if(P.busy<=0&&P.act&&P.act.fn){const f=P.act.fn;P.act=null;P.anim=null;f()}else if(P.busy<=0)P.anim=null}
else if(P.path.length){const w=P.path[0],d=stepTo(P,w[0],w[1],P.path.length===1?2.2:run*.9,dt);moving=true;if(d<.1){P.path.shift();if(!P.path.length){moving=false;if(mark)mark.visible=false;if(P.act){if(P.act.x!==undefined){P.x=P.act.x;P.z=P.act.z}P.rot=P.act.rot;P.busy=P.act.name==='desk'?.35:.7;P.anim=P.act.name==='desk'?null:'reach'}}}}
P.mv=moving;P.ph+=dt*(moving?(run>3?12:9):0);
const u=ch.userData,sw=moving?Math.sin(P.ph)*.7:0;ch.position.set(P.x,P.sit?-.08:0,P.z);ch.rotation.y=P.rot;
u.legs[0].rotation.x=P.sit?-1.5:sw;u.legs[1].rotation.x=P.sit?-1.5:-sw;
let aL=-sw*.8,aR=sw*.8;if(P.sit){aL=aR=-1.1+Math.sin(t*9)*.05}else if(P.anim==='reach'||P.anim==='pet'){aR=-1.7;aL=-.3}else if(cheer>0){aL=aR=-2.6+Math.sin(t*14)*.4}
u.arms[0].rotation.x=aL;u.arms[1].rotation.x=aR;u.head.position.y=1.6+(moving?Math.abs(Math.sin(P.ph))*.03:Math.sin(t*2)*.01);
// companion follow
const dx=P.x-C.x,dz=P.z-C.z,dist=Math.hypot(dx,dz);C.t-=dt;
if(dist>1.7){if(C.t<=0||!C.path.length){C.path=path(C.x,C.z,P.x,P.z)||[];C.t=.5}}else C.path=[];
let cm=false;if(C.path.length&&dist>1.3){const w=C.path[0],sp2=dist>4?4:2.4;const d=stepTo(C,w[0],w[1],sp2,dt);cm=true;if(d<.12)C.path.shift()}else if(dist<.9){const l=dist||1;C.x-=dx/l*dt;C.z-=dz/l*dt;C.x=Math.max(-5.6,Math.min(5.6,C.x))}
if(!cm)C.rot+=ad(C.rot,Math.atan2(dx,dz))*Math.min(1,dt*3);C.ph+=dt*(cm?12:0);
cat.position.set(C.x,Math.abs(Math.sin(C.ph))*.06,C.z);cat.rotation.y=C.rot;tail.rotation.z=Math.sin(t*(cm?9:3))*.5;chd.rotation.z=cheer>0?Math.sin(t*12)*.2:0;chd.position.y=.5+(cheer>0?Math.abs(Math.sin(t*10))*.08:0);cat.scale.y=!cm&&dist<2.2?.92+Math.sin(t*1.6)*.02:1;
if(cheer>0)cheer-=dt;
lampL.intensity=1.05+Math.sin(t*3)*.03;
const b=$('#bub');if(b.style.display==='block'){const v=new THREE.Vector3(C.x,1.2,C.z).project(cam);b.style.left=(v.x+1)/2*innerWidth+'px';b.style.top=(1-v.y)/2*innerHeight+'px'}
R.render(sc,cam)}
requestAnimationFrame(frame);
setTimeout(()=>{$('#load').style.opacity=0;setTimeout(()=>$('#load').remove(),900)},900);
if(S.timer&&S.timer.run&&Date.now()>=S.timer.endAt)finish();
}catch(err){fail(err.message||String(err));console.error(err)}
</script></body></html>
